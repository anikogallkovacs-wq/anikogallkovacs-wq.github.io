# Short bio
bio: |
  ![Gáll Anikó](/images/gall-aniko.jpg)

  HR- és szervezetfejlesztési szakemberként több mint 10 éve dolgozom azon, hogy emberközpontú szervezeteket építsek, és támogassam az üzleti növekedést. Pályám során a munkavállalói életciklus minden szakaszával foglalkoztam: a toborzástól és a beillesztéstől a teljesítménymenedzsmenten, a vezetőfejlesztésen és a munkavállalói élményen át egészen a kiléptetésig.

  Jelenleg egy több mint 50 fős technológiai vállalat HR- és jólléti területét vezetem, és szorosan együttműködöm a vezetőséggel a stratégiai kezdeményezésekben és a napi HR-működésben egyaránt.

  Az elmúlt években kulcsszerepem volt abban, hogy a cég 18 hónap alatt 34-ről 53 főre bővült. A rendkívül versenyképes IT-munkaerőpiacon, Budapesten kívül, irodai munkavégzésre épülő kultúra mellett sikerült új kollégákat bevonzani és beilleszteni. A vállalat ebben az időszakban a BÉT 50 és a Financial Times FT1000 rangsorában is helyet kapott.

  A növekedéssel párhuzamosan a felsővezetéssel közösen jelentős szervezeti átalakítást vittünk végig: új működési struktúrát alakítottunk ki nyolc területi vezetővel, megerősítettük a belső kommunikációt, és strukturáltabb folyamatokat vezettünk be a fenntartható növekedés érdekében.

  Én vezettem a vállalat munkavállalói jólléti kezdeményezéseinek kialakítását is, ami hozzájárult ahhoz, hogy a cég 3. helyezést ért el a BenefitPrize 2025-ön, Magyarország egyik legrangosabb munkahelyi jólléti díján. A gyors növekedés és az átalakulás teljes időszakában a fluktuáció tartósan 5% körül maradt, jóval a piacon jellemző 10–20% alatt.

  Erősségeim a szervezetfejlesztés, a vezetőkkel való partneri együttműködés, a változásmenedzsment, a munkavállalói élmény, valamint az elkötelezett, magas teljesítményű munkahelyi közösségek építése.

  Személyes motivációm egyszerű: ébren töltött időnk nagy részét a munkahelyünkön töltjük, ezért fontosnak tartom, hogy a munka jó érzéssel töltsön el bennünket, és értelmet, célt, élményt találjunk benne. Ezt keresem a saját munkámban is, és ebben szeretnék másokat is támogatni – kutatóként és a gyakorlatban egyaránt.

