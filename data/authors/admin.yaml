# Short bio
bio: |
  ![Gáll Anikó](/images/gall-aniko.jpg)

  Több mint 10 éve dolgozom a HR és a szervezetfejlesztés területén, és ez idő alatt a munkavállalói életciklus szinte minden szakaszával találkoztam, a toborzástól és a beillesztéstől a vezető- és munkatársfejlesztésen át a kiléptetésig. Mindvégig az foglalkoztatott, hogyan lehet olyan szervezetet építeni, amely jó hely az embereknek, és közben az üzleti célokat is támogatja.

  Jelenleg egy több mint 50 fős technológiai vállalatnál felelek a HR és a jóllét területéért, szoros együttműködésben a vezetőséggel. Az elmúlt években részese lehettem annak, ahogy a cég 18 hónap alatt 34-ről 53 főre nőtt – Budapesten kívül, irodai munkavégzés mellett, a kiélezett IT-munkaerőpiacon. A növekedés a működés átalakulását is magával hozta: a felsővezetés munkáját támogatva segítettem kialakítani egy nyolc területi vezetőre épülő új struktúrát, és megerősíteni a belső kommunikációt és a folyamatokat. A cég ebben az időszakban a BÉT 50 és a Financial Times FT1000 rangsorába is bekerült.

  A jólléti kezdeményezések kialakításán is dolgoztam, és örülök, hogy a cég 2025-ben 3. helyezést ért el a BenefitPrize munkahelyi jólléti díjon.

  Leginkább a szervezetfejlesztés, a vezetőkkel való együttműködés, a változások támogatása és az összetartó munkahelyi közösségek építése áll közel hozzám. Személyes motivációm egyszerű: ébren töltött időnk nagy részét a munkahelyünkön töltjük, ezért fontosnak tartom, hogy a munka jó érzéssel töltsön el, és értelmet, célt, élményt találjunk benne. Ezt keresem a saját munkámban is, és ebben szeretnék másokat is támogatni – kutatóként és a gyakorlatban egyaránt.

